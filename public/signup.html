<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Saraha Anonymous Messages</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="brand-logo"><span class="brand-icon">🔒</span> Saraha</a>
      <ul class="nav-menu" id="nav-menu"></ul>
    </div>
  </nav>

  <main class="main-container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 120px); padding-top: 1.5rem; padding-bottom: 2rem;">
    <div class="card" style="width: 100%; max-width: 480px;">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Create Your Account ✨</h2>
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.75rem; font-size: 0.95rem;">
        Start receiving anonymous messages in less than a minute.
      </p>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="username">Username (Handle)</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. alex2026" required minlength="3">
          <small id="handle-feedback" style="display: block; margin-top: 0.25rem; font-size: 0.8rem;"></small>
        </div>

        <div class="form-group">
          <label class="form-label" for="name">Display Name (Optional)</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. Alex Morgan">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1rem;">
          Register Account
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Log In</a>
      </p>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { apiFetch, setToken, setUser, showToast, getUser } from '/js/app.js';

    if (getUser()) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('signup-form');
    const usernameInput = document.getElementById('username');
    const handleFeedback = document.getElementById('handle-feedback');
    const submitBtn = document.getElementById('submit-btn');

    let checkTimeout;
    usernameInput.addEventListener('input', () => {
      clearTimeout(checkTimeout);
      const username = usernameInput.value.trim();

      if (username.length < 3) {
        handleFeedback.style.color = 'var(--text-muted)';
        handleFeedback.innerText = 'Username must be at least 3 characters.';
        return;
      }

      checkTimeout = setTimeout(async () => {
        try {
          const res = await apiFetch(`/user/check-username?username=${encodeURIComponent(username)}`);
          if (res.available) {
            handleFeedback.style.color = '#10b981';
            handleFeedback.innerText = '✓ Username handle is available!';
          } else {
            handleFeedback.style.color = '#ef4444';
            handleFeedback.innerText = '✗ ' + res.message;
          }
        } catch (e) {
          console.error(e);
        }
      }, 300);
    });

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating account...';

      try {
        const res = await apiFetch('/auth/signup', {
          method: 'POST',
          body: JSON.stringify({ username, name, email, password })
        });

        setToken(res.token);
        setUser(res.data.user);
        showToast('Account created successfully!', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 800);
      } catch (error) {
        showToast(error.message || 'Registration failed', 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Register Account';
      }
    });
  </script>
</body>
</html>
