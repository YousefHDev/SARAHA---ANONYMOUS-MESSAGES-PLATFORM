<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Anonymous Message - Saraha</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="brand-logo"><span class="brand-icon">🔒</span> Saraha</a>
      <ul class="nav-menu" id="nav-menu"></ul>
    </div>
  </nav>

  <main class="main-container" style="max-width: 600px; padding-top: 2rem;">
    
    <!-- User Profile Header Card -->
    <div class="card" style="text-align: center; margin-bottom: 2rem;" id="recipient-card">
      <div id="profile-loading" style="padding: 2rem; color: var(--text-muted);">
        Loading recipient profile... ⏳
      </div>
      <div id="profile-content" style="display: none;">
        <img id="recipient-avatar" src="/uploads/default-avatar.svg" alt="Avatar" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color); margin-bottom: 1rem;">
        <h2 id="recipient-name" style="margin-bottom: 0.25rem;">Loading...</h2>
        <div id="recipient-handle" style="color: var(--primary-color); font-weight: 600; font-size: 0.95rem; margin-bottom: 0.75rem;">@username</div>
        <p id="recipient-bio" style="color: var(--text-secondary); font-size: 0.95rem; max-width: 450px; margin: 0 auto 1rem;">Bio goes here</p>
        
        <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: var(--border-color-highlight); padding: 0.4rem 1rem; border-radius: var(--radius-full); font-size: 0.85rem; color: var(--text-primary);">
          <span>🔒 100% Anonymous Delivery</span>
        </div>
      </div>
    </div>

    <!-- Anonymous Message Form Card -->
    <div class="card" id="form-card" style="display: none;">
      <h3 style="margin-bottom: 1rem;">Write Your Secret Message ✍️</h3>
      
      <form id="send-msg-form">
        <div class="form-group" style="position: relative;">
          <textarea id="message-content" class="form-control" placeholder="Type your constructive thoughts, secret feedback, or friendly compliment here... Be kind!" required maxlength="1000"></textarea>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">
            <span>Never send hate, threats, or harassment.</span>
            <span id="char-counter">0 / 1000</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 0.85rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
          <div>
            <div style="font-weight: 600; font-size: 0.9rem;">🔐 Basic Message Encryption</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Encrypt payload with Crypto-JS key before delivery</div>
          </div>
          <label style="position: relative; display: inline-block; width: 44px; height: 24px;">
            <input type="checkbox" id="encrypt-toggle" style="opacity: 0; width: 0; height: 0;">
            <span id="toggle-slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .4s; border-radius: 24px;"></span>
          </label>
        </div>

        <button type="submit" id="send-btn" class="btn btn-primary btn-block">
          Send Anonymous Message 🚀
        </button>
      </form>
    </div>

  </main>

  <style>
    #encrypt-toggle:checked + #toggle-slider {
      background-color: var(--primary-color);
    }
    #toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    #encrypt-toggle:checked + #toggle-slider:before {
      transform: translateX(20px);
    }
  </style>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { apiFetch, showToast } from '/js/app.js';

    const urlParams = new URLSearchParams(window.location.search);
    const targetUsername = urlParams.get('u');

    const profileLoading = document.getElementById('profile-loading');
    const profileContent = document.getElementById('profile-content');
    const formCard = document.getElementById('form-card');
    
    let targetUserId = null;

    if (!targetUsername) {
      profileLoading.innerHTML = `
        <div style="color: #ef4444; font-weight: 600;">No recipient username specified!</div>
        <p style="margin-top: 0.5rem;">Please provide a valid handle URL parameter like <code>?u=username</code></p>
        <a href="/index.html" class="btn btn-secondary btn-sm" style="margin-top: 1rem;">Back to Home</a>
      `;
    } else {
      loadProfile(targetUsername);
    }

    async function loadProfile(username) {
      try {
        const res = await apiFetch(`/user/public/${encodeURIComponent(username)}`);
        const user = res.data.user;

        targetUserId = user.id || user._id;

        document.getElementById('recipient-avatar').src = user.avatar || '/uploads/default-avatar.svg';
        document.getElementById('recipient-name').innerText = user.name || user.username;
        document.getElementById('recipient-handle').innerText = `@${user.username}`;
        document.getElementById('recipient-bio').innerText = user.bio || 'Leave a constructive secret note!';

        profileLoading.style.display = 'none';
        profileContent.style.display = 'block';
        formCard.style.display = 'block';
      } catch (err) {
        profileLoading.innerHTML = `
          <div style="color: #ef4444; font-weight: 600;">User profile "@${username}" not found!</div>
          <a href="/index.html" class="btn btn-secondary btn-sm" style="margin-top: 1rem;">Back to Home</a>
        `;
      }
    }

    // Character counter
    const textarea = document.getElementById('message-content');
    const charCounter = document.getElementById('char-counter');

    textarea?.addEventListener('input', () => {
      const len = textarea.value.length;
      charCounter.innerText = `${len} / 1000`;
    });

    // Form submit handler
    const form = document.getElementById('send-msg-form');
    const sendBtn = document.getElementById('send-btn');

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = textarea.value.trim();
      const isEncrypted = document.getElementById('encrypt-toggle').checked;

      if (!content) {
        showToast('Please type a message content first.', 'error');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.innerText = 'Sending anonymously...';

      try {
        const res = await apiFetch('/message/send', {
          method: 'POST',
          body: JSON.stringify({
            recipient: targetUsername || targetUserId,
            content,
            isEncrypted
          })
        });

        showToast(res.message || 'Anonymous message delivered successfully! 🎉', 'success');
        textarea.value = '';
        charCounter.innerText = '0 / 1000';
        sendBtn.disabled = false;
        sendBtn.innerText = 'Send Anonymous Message 🚀';
      } catch (err) {
        showToast(err.message || 'Failed to send message', 'error');
        sendBtn.disabled = false;
        sendBtn.innerText = 'Send Anonymous Message 🚀';
      }
    });
  </script>
</body>
</html>
