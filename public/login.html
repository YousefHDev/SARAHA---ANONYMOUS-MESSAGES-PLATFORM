<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Saraha Anonymous Messages</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/index.html" class="brand-logo"><span class="brand-icon">🔒</span> Saraha</a>
      <ul class="nav-menu" id="nav-menu"></ul>
    </div>
  </nav>

  <main class="main-container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 120px);">
    <div class="card" style="width: 100%; max-width: 440px;">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back 👋</h2>
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">
        Log in to access your anonymous inbox dashboard.
      </p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="emailOrUsername">Email or Username</label>
          <input type="text" id="emailOrUsername" class="form-control" placeholder="e.g. alex or alex@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1rem;">
          Log In
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account yet? <a href="/signup.html" style="font-weight: 600;">Create one now</a>
      </p>
    </div>
  </main>

  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import { apiFetch, setToken, setUser, showToast, getUser } from '/js/app.js';

    if (getUser()) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailOrUsername = document.getElementById('emailOrUsername').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Logging in...';

      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ emailOrUsername, password })
        });

        setToken(res.token);
        setUser(res.data.user);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 800);
      } catch (error) {
        showToast(error.message || 'Login failed', 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Log In';
      }
    });
  </script>
</body>
</html>
